<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D模式 - 绘制三维线条</title>
    <style>
        body { margin: 0; }
        canvas { display: block; }
        #modeSwitch {
            position: absolute;
            top: 20px;
            left: 20px;
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            border-radius: 20px;
            padding: 5px 10px;
            cursor: pointer;
            z-index: 10;
        }
    </style>
</head>
<body>
    <!-- 模式切换按钮 -->
    <div id="modeSwitch">
        <span id="modeText">切换到2D模式</span>
    </div>

    <!-- 引入外部 JS 文件 -->
    <script type="module" src="{{ url_for('static', filename='js/3d_script.js') }}"></script>
</body>
</html>
